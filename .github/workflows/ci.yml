# Checks every pull request into main. No deploys, no secrets: tests use the dummy
# values in test/env.ts with a fake Supabase and blocked network, and the build
# uses the dummy env below, so this job cannot reach any production service.
name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (frontend and backend)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
        env:
          # Dummy values only. Never add repository secrets here.
          VITE_API_URL: https://api.test.invalid
          SUPABASE_URL: https://supabase.test.invalid
          SUPABASE_ANON_KEY: test-anon-key
          DEMO_MODE: 'false'
          DEMO_WHATSAPP_NUMBER: ''
